<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- customized CCS and fonts -->
    <link rel="stylesheet" href="style.css">
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">
    <title>Rock Paper Scissor Game</title>
  </head>
  <body>
    <main class="container">
      <article class="scores" >
        <p>Computer : <span id="computer_score" >0</span></p>
        <p>You : <span id="user_score" >0</span></p>
      </article>
      <article class="weapons">
        <button type="button" title="rock" onclick="checker('rock')" ><i class="fa-solid fa-hand-fist"></i></button> 
        <button type="button" title="paper" onclick="checker('paper')" ><i class="fa-solid fa-hand-paper"></i></button>
        <button type="button" title="scissors" onclick="checker('scissors')" ><i class="fa-solid fa-hand-scissors"></i></button>
      </article>
      <article class="details">
        <p id="user_choice" class="user_choice"></p>
        <p id="comp_choice" class="comp_choice" ></p>
        <p id="result" class="result" ></p>
      </article>
    </main>
    <!-- script -->
    <script src="./script.js"></script>
  </body>
</html>
